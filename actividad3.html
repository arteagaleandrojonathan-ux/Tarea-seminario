<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="actividad3.css">
</head>
<body>

    <script href="actividad3.js"></script>
    <h1>Realizar cotizacion</h1>
    <form action="" class="formulario">
        <label for="">Apellidos</label>
        <input type="text" id="Apellidos" minlength="3" required>

        <label for="">Nombres</label>
        <input type="text" id="Nombres" minlength="3" required>

        <label for="">Correo Electronico</label>
        <input type="email" id="email" required>

        <label for="">Equipo</label>
        <select name="" id="Documento" required>
            <option value="">Seleccione</option>
            <option value="PC">PC</option>
            <option value="Portatil">Portatil</portal>
        </select>

        <label for="">Equipo Preferido</label>
        <select name="" id="Equipo" required>
            <option value="">Seleccione</option>
            <option value="PC Gamer">PC Gamer</option>
            <option value="PC Basica">PC Basica</portal>
            <option value="Laptop Gamer">Laptop Gamer</option>
            <option value="Laptop Basica">Laptop Basica</portal>  
        </select>
        
        <label for="">Cantidad</label>
        <input type="number" id="cantidad" min="1" value="1" required>

        <button type="commit">Cotizar</button>
        <button type="reset">Reiniciar</button>
    </form>
</body>
</html>
